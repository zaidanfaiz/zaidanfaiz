<svg xmlns="http://www.w3.org/2000/svg" width="750" height="90" viewBox="0 0 750 90" role="img" aria-label="Always experimenting — animated status">
<defs><linearGradient id="g"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
<style>
.radar{transform-origin:48px 45px;animation:rotate 5s linear infinite}
.pulse{animation:pulse 2.1s ease-in-out infinite}
.spark{animation:move 5s ease-in-out infinite}
@keyframes rotate{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes move{0%,100%{opacity:.2}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="748" height="88" rx="17" fill="#0c1527" stroke="#28617a" stroke-opacity=".7"/>
<circle cx="48" cy="45" r="28" fill="none" stroke="#22d3ee" stroke-opacity=".35"/><circle cx="48" cy="45" r="17" fill="none" stroke="#22d3ee" stroke-opacity=".25"/>
<g class="radar"><path d="M48 45L48 17A28 28 0 0 1 76 45Z" fill="#22d3ee" fill-opacity=".19"/><path d="M48 45V17" stroke="#22d3ee" stroke-width="2.5"/></g>
<circle cx="48" cy="45" r="5" fill="#22d3ee" class="pulse"/>
<text x="102" y="39" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#e7faff" letter-spacing="1">ALWAYS EXPERIMENTING</text>
<text x="104" y="62" font-family="monospace" font-size="13" fill="#9dbed3">Build  •  Test  •  Break  •  Improve  •  Repeat</text>
<path d="M580 45H715" stroke="url(#g)" stroke-width="2" stroke-dasharray="3 8" class="spark"/>
<circle cx="715" cy="45" r="7" fill="#a78bfa" class="pulse"/>
</svg>