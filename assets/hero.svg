<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-label="Zaidan Faiz — building ideas into code">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060b1e"/><stop offset=".52" stop-color="#111b38"/><stop offset="1" stop-color="#082d44"/></linearGradient>
    <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="name" x1="0" x2="1"><stop stop-color="#e8fcff"/><stop offset=".65" stop-color="#80eaff"/><stop offset="1" stop-color="#baa7ff"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#22d3ee" stop-opacity=".23"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#8bb7d2" stroke-opacity=".075"/></pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <style>
    .orbit{transform-box:fill-box;transform-origin:center;animation:spin 19s linear infinite}
    .orbit-reverse{transform-box:fill-box;transform-origin:center;animation:spin 29s linear infinite reverse}
    .dash{stroke-dasharray:10 14;animation:flow 8s linear infinite}
    .pulse{animation:pulse 3s ease-in-out infinite}
    .scan{animation:scan 7s ease-in-out infinite}
    .twinkle{animation:twinkle 3.8s ease-in-out infinite}
    .float{animation:float 5s ease-in-out infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes flow{to{stroke-dashoffset:-240}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes scan{0%,100%{transform:translateY(-55px);opacity:0}25%,70%{opacity:.65}50%{transform:translateY(115px)}}
    @keyframes twinkle{0%,100%{opacity:.14}50%{opacity:1}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="1200" height="350" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="350" rx="22" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="348" rx="21" fill="none" stroke="url(#edge)" stroke-opacity=".5" stroke-width="2"/>
  <ellipse cx="985" cy="160" rx="250" ry="210" fill="url(#glow)"/>
  <path d="M0 322H1200" stroke="url(#edge)" stroke-opacity=".65" stroke-width="2"/>
  <g opacity=".6" stroke="#22d3ee" fill="none"><path d="M-50 75H440M790 280H1250" stroke-opacity=".17"/><path d="M30 100H65M760 80H820M1110 270H1175" stroke-width="3"/></g>
  <circle cx="130" cy="44" r="3" fill="#22d3ee" class="twinkle"/><circle cx="540" cy="60" r="2" fill="#a78bfa" class="twinkle"/><circle cx="685" cy="285" r="3" fill="#22d3ee" class="twinkle"/>
  <g class="float">
    <rect x="64" y="44" width="253" height="31" rx="15.5" fill="#22d3ee" fill-opacity=".09" stroke="#22d3ee" stroke-opacity=".35"/>
    <circle cx="83" cy="59.5" r="5" fill="#2dd4bf" class="pulse"/>
    <text x="99" y="64" font-size="13" font-family="monospace" font-weight="700" letter-spacing="1.4" fill="#8cecff">HELLO, WORLD_</text>
  </g>
  <text x="64" y="176" font-family="Arial,Helvetica,sans-serif" font-size="95" font-weight="800" letter-spacing="3" fill="url(#name)">ZAIDAN</text>
  <text x="64" y="268" font-family="Arial,Helvetica,sans-serif" font-size="95" font-weight="800" letter-spacing="4" fill="url(#name)">FAIZ<tspan fill="#22d3ee">.</tspan></text>
  <text x="69" y="305" font-family="monospace" font-size="16" letter-spacing="1.8" fill="#99b8d3">DEVELOPER  /  BUILDER  /  EXPLORER</text>
  <g transform="translate(975 170)">
    <circle r="128" fill="none" stroke="#22d3ee" stroke-opacity=".12"/>
    <circle r="101" fill="none" stroke="#22d3ee" stroke-opacity=".4" stroke-width="1.5" stroke-dasharray="4 10"/>
    <g class="orbit"><ellipse rx="135" ry="71" fill="none" stroke="#818cf8" stroke-width="2" stroke-opacity=".55" transform="rotate(-32)"/><circle cx="113" cy="-75" r="6" fill="#a78bfa"/></g>
    <g class="orbit-reverse"><ellipse rx="79" ry="129" fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity=".55" transform="rotate(30)"/><circle cx="76" cy="68" r="5" fill="#22d3ee"/></g>
    <circle r="68" fill="#08192e" stroke="#22d3ee" stroke-opacity=".48" stroke-width="2"/>
    <circle r="58" fill="none" stroke="#a78bfa" stroke-opacity=".45" class="dash"/>
    <path d="M-30 -21L-49 0L-30 21M30 -21L49 0L30 21M8 -29L-8 29" fill="none" stroke="#7ce9fb" stroke-linecap="round" stroke-linejoin="round" stroke-width="7"/>
    <path d="M-64 -29H64" stroke="#22d3ee" stroke-opacity=".2" stroke-width="4" class="scan"/>
  </g>
  <g font-family="monospace" fill="#65e6fa" font-size="11" opacity=".65"><text x="787" y="39">SYSTEM_ONLINE</text><text x="1074" y="317">01 // DEV</text></g>
</svg>