    <g class="c"><text x="30" y="158" fill="#2dd4bf">➜</text><text x="61" y="158" fill="#83e9fb">~</text><text x="93" y="158" fill="#ecf8ff">cat interests.txt</text></g>
    <g class="d"><text x="44" y="192" fill="#a78bfa">Web Development</text><text x="255" y="192" fill="#7688a2">·</text><text x="278" y="192" fill="#8cecff">Android</text><text x="383" y="192" fill="#7688a2">·</text><text x="406" y="192" fill="#b5c3fc">Virtualization</text><text x="598" y="192" fill="#7688a2">·</text><text x="621" y="192" fill="#b1ebda">Systems</text></g>
