<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="247" viewBox="0 0 1100 247" role="img" aria-label="Animated developer terminal introducing Zaidan">
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1228"/><stop offset="1" stop-color="#111b32"/></linearGradient>
    <linearGradient id="rule" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  </defs>
  <style>
    .caret{animation:blink 1.05s step-end infinite}
    .a{animation:enter1 10s ease-in-out infinite}
    .b{animation:enter2 10s ease-in-out infinite}
    .c{animation:enter3 10s ease-in-out infinite}
    .d{animation:enter4 10s ease-in-out infinite}
    .glow{animation:glow 3s ease-in-out infinite}
    @keyframes blink{50%{opacity:0}}
    @keyframes glow{50%{opacity:.25}}
    @keyframes enter1{0%{opacity:.2}5%,100%{opacity:1}}
    @keyframes enter2{0%,13%{opacity:.12}19%,100%{opacity:1}}
    @keyframes enter3{0%,27%{opacity:.12}33%,100%{opacity:1}}
    @keyframes enter4{0%,43%{opacity:.12}49%,100%{opacity:1}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
  </style>
  <rect x="1.5" y="1.5" width="1097" height="244" rx="17" fill="url(#back)" stroke="#244364" stroke-width="3"/>
  <path d="M17 49H1083" stroke="url(#rule)" stroke-opacity=".5"/>
  <circle cx="27" cy="26" r="7" fill="#ff6b79"/><circle cx="50" cy="26" r="7" fill="#ffce65"/><circle cx="73" cy="26" r="7" fill="#35d8a2"/>
